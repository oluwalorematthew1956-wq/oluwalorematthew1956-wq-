  <body>
    <header>
      <h1>Contact Me</h1>
      <p>I'd really like to hear from you</p>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Me</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="academic.html">Academic</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <article id="contact">
        <h2>Contact Me</h2>
        <p>I'd really like to hear from you</p>

        <form action="https://httpbin.org/get" method="get">
          <fieldset>
            <legend>Personal Info</legend>
            <p>
              <label for="firstName">First Name</label>
              <input
                type="text"
                name="firstName"
                id="firstName"
                placeholder="Jane"
                autocomplete="on"
                required
                autofocus
              />
            </p>
            <p>
              <label for="lastName">Last Name</label>
              <input
                type="text"
                name="lastName"
                id="lastName"
                placeholder="Doe"
                autocomplete="on"
                required
              />
            </p>

            <p>
              <label for="email">Email</label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="example@gmail.com"
                required
              />
            </p>

            <p>
              <label for="password">Password</label>
              <input
                type="password"
                name="password"
                id="password"
                placeholder="Your Secret"
                required
              />
            </p>
            <p>
              <label for="phone">Phone</label>
              <input
                type="tel"
                name="phone"
                id="phone"
                placeholder="5555555555"
                pattern="[0-9]{10,11}"
                required
              />
            </p>
            <p>
              <label for="decade">Favorite Decade</label>
              <input
                type="number"
                name="decade"
                id="decade"
                min="1950"
                max="2020"
                step="10"
                value="1990"
              />
            </p>
            <p>
              <label for="coffee">Favorite Coffee</label>
              <select name="coffee" id="coffee" multiple size="5">
                <optgroup label="Coffees">
                  <option value="regular coffee">Regular coffee</option>
                  <option value="iced coffe">Iced coffee</option>
                </optgroup>
                <optgroup label="Espresso Drink">
                  <option value="latte" selected>Latte</option>
                  <option value="cappuccino">Cappuccino</option>
                  <option value="americano">Americano</option>
                  <option value="cortado">Cortado</option>
                  <option value="other">other</option>
                </optgroup>
              </select>
            </p>
          </fieldset>

          <fieldset>
            <legend>What is your favorite food</legend>
            <p>
              <input type="radio" name="food" id="tacos" value="tacos" />
              <label for="tacos">Tacos</label>
            </p>
            <p>
              <input type="radio" name="food" id="pizza" value="pizza" />
              <label for="pizza">Pizza</label>
            </p>
            <p>
              <input type="radio" name="food" id="other" value="other" />
              <label for="other">Other</label>
            </p>
          </fieldset>

          <fieldset>
            <legend>Did you have pet?</legend>
            <p>
              <input type="checkbox" name="pet" id="dog" value="dog" />
              <label for="dog">Dog</label>
            </p>
            <p>
              <input type="checkbox" name="pet" id="cat" value="cat" />
              <label for="cat">Cat</label>
            </p>
            <p>
              <input type="checkbox" name="pet" id="parrot" value="parrot" />
              <label for="parrot">Parrot</label>
            </p>
            <p>
              <input
                type="checkbox"
                name="pet"
                id="otherpet"
                value="otherpet"
              />
              <label for="otherpet">Other</label>
            </p>
          </fieldset>

          <fieldset>
            <legend>Send Me A Note</legend>
            <label for="message">Your Message</label>
            <br />
            <textarea
              name="message"
              id="message"
              cols="30"
              rows="10"
              placeholder="Type Your Message Here"
            ></textarea>
          </fieldset>

          <button type="submit">Submit</button>
          <button
            type="submit"
            formaction="https://httpbin.org/post"
            formmethod="post"
          >
            Post
          </button>
          <button type="reset">Reset</button>
        </form>
      </article>
    </main>

    <footer>
      <p>
        &lt; &lt; &lt; <a href="about.html">Oluwalore Matthew</a> &gt;&gt;&gt;
      </p>
      <p><a href="#">↑ Back to Top</a></p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
